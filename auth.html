<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelf It - Sign in</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f2ea;
      }
      .auth-shell {
        width: min(460px, 90vw);
        background: #fffdf9;
        border: 1px solid #ddd8ce;
        border-radius: 18px;
        padding: 36px 28px;
        box-shadow: 0 16px 40px rgba(45,42,34,.08);
      }
      .auth-shell h1 {
        margin: 0 0 12px;
        font-size: 2.3rem;
        letter-spacing: -1px;
      }
      .auth-shell p {
        margin: 0 0 24px;
        color: #747a72;
      }
      .auth-form {
        display: grid;
        gap: 16px;
      }
      .auth-form label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }
      .auth-form input {
        border: 1px solid #d7d1c5;
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
      }
      .auth-form button {
        margin-top: 8px;
        background: #3f6757;
        color: #fff;
        border-radius: 10px;
        padding: 12px 16px;
        font-weight: 700;
      }
      .switch-link {
        margin-top: 18px;
        color: #3f6757;
        text-align: center;
        cursor: pointer;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="auth-shell">
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSubtitle">Sign in to your shelf.</p>

      <form id="authForm" class="auth-form">
        <label id="nameField" class="hidden">
          Name
          <input name="name" type="text" placeholder="Your name" />
        </label>

        <label>
          Email
          <input name="email" type="email" placeholder="you@example.com" required />
        </label>

        <label>
          Password
          <input name="password" type="password" placeholder="••••••••" required />
        </label>

        <button id="authSubmit" type="submit">Sign in</button>
      </form>

      <div class="switch-link" id="toggleAuthMode">Need an account? Sign up</div>
    </main>

    <script>
      const mode = { signup: false };
      const authTitle = document.getElementById('authTitle');
      const authSubtitle = document.getElementById('authSubtitle');
      const authSubmit = document.getElementById('authSubmit');
      const toggleAuthMode = document.getElementById('toggleAuthMode');
      const nameField = document.getElementById('nameField');
      const form = document.getElementById('authForm');

      function setMode(isSignup) {
        mode.signup = isSignup;
        nameField.classList.toggle('hidden', !isSignup);
        authTitle.textContent = isSignup ? 'Create your shelf' : 'Welcome back';
        authSubtitle.textContent = isSignup ? 'Set up a new account to start collecting.' : 'Sign in to your shelf.';
        authSubmit.textContent = isSignup ? 'Create account' : 'Sign in';
        toggleAuthMode.textContent = isSignup ? 'Already have an account? Sign in' : 'Need an account? Sign up';
      }

      toggleAuthMode.addEventListener('click', () => setMode(!mode.signup));

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const payload = {
          name: formData.get('name')?.trim(),
          email: formData.get('email')?.trim(),
          password: formData.get('password')
        };

        const url = mode.signup ? '/api/auth/signup' : '/api/auth/login';

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          alert(result.error || 'Authentication failed.');
          return;
        }

        localStorage.setItem('shelf-it-token', result.token);
        window.location.href = '/';
      });

      const existingToken = localStorage.getItem('shelf-it-token');
      if (existingToken) {
        fetch('/api/auth/me', {
          headers: { Authorization: `Bearer ${existingToken}` }
        }).then((response) => {
          if (response.ok) {
            window.location.href = '/';
          }
        }).catch(() => {});
      }

      setMode(false);
    </script>
  </body>
</html>
